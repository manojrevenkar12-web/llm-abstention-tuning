# CPU smoke run on a tiny random model and local fixtures — proves the pipeline end to end.
# Metrics from this run are meaningless by design.
run_name: smoke
output_dir: runs
seed: 0

model:
  base: runs/_tiny_model
  precision: fp32

data:
  train: { name: fixture_train, source: jsonl, path: tests/fixtures/qa_train.jsonl }
  eval:
    - { name: fixture_eval, source: jsonl, path: tests/fixtures/qa_eval.jsonl }
    - { name: fixture_ood,  source: jsonl, path: tests/fixtures/qa_ood.jsonl }
  in_distribution: fixture_eval

generation: { batch_size: 8, max_new_tokens: 6 }
probe: { num_samples: 3, temperature: 1.0, top_p: 1.0 }
build: { dpo_fraction: 0.5, partial_policy_sft: abstain }

train:
  lora: { r: 4, alpha: 8, dropout: 0.0, target_modules: all-linear }
  sft:  { epochs: 1, learning_rate: 1.0e-3, batch_size: 4, max_length: 128 }
  dpo:  { epochs: 1, learning_rate: 1.0e-3, beta: 0.1, batch_size: 4, grad_accum: 1, max_length: 128 }

eval:
  probe_samples: 2
  bootstrap: 50
